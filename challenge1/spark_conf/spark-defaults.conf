spark.jars.packages org.apache.hudi:hudi-spark3.3-bundle_2.12:0.12.2,org.apache.spark:spark-avro_2.12:3.3.2,org.apache.hadoop:hadoop-aws:3.3.2,com.amazonaws:aws-java-sdk-bundle:1.12.262
